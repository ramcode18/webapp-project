
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODERWANDA WebApp</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 60px 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to CODERWANDA Ltd</h1>
        <p>Web Application Development Project</p>

        <a href="login.html">Login</a>
    </div>

</body>
